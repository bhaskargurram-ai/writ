[workspace]
resolver = "2"
members = [
    "crates/writ-core",
    "crates/writ-policy",
    "crates/writ-ledger",
    "crates/writ-mcp",
    "crates/writ-sandbox",
    "crates/writ-replay",
    "crates/writ-otel",
    "crates/writ-tui",
    "crates/writ-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/writai/writ"
homepage = "https://writ.dev"
description = "Authorization and provenance for AI agents. One policy file, one signed ledger, any agent."

[workspace.dependencies]
writ-core = { path = "crates/writ-core" }
writ-policy = { path = "crates/writ-policy" }
writ-ledger = { path = "crates/writ-ledger" }
writ-mcp = { path = "crates/writ-mcp" }
writ-sandbox = { path = "crates/writ-sandbox" }
writ-replay = { path = "crates/writ-replay" }
writ-otel = { path = "crates/writ-otel" }
writ-tui = { path = "crates/writ-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
