[workspace]
resolver = "2"
members = [
    "crates/writ-core",
    "crates/writ-policy",
    "crates/writ-ledger",
    "crates/writ-mcp",
    "crates/writ-sandbox",
    "crates/writ-replay",
    "crates/writ-otel",
    "crates/writ-tui",
    "crates/writ-cli",
    "crates/writ-policy-rego",
    "crates/writ-policy-cedar",
    "crates/writ-sandbox-docker",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/writ-agent/writ"
homepage = "https://writ-omega.vercel.app"
description = "Authorization and provenance for AI agents. One policy file, one tamper-evident ledger, any agent."

[workspace.dependencies]
writ-core = { path = "crates/writ-core" }
writ-policy = { path = "crates/writ-policy" }
writ-ledger = { path = "crates/writ-ledger" }
writ-mcp = { path = "crates/writ-mcp" }
writ-sandbox = { path = "crates/writ-sandbox" }
writ-replay = { path = "crates/writ-replay" }
writ-otel = { path = "crates/writ-otel" }
writ-tui = { path = "crates/writ-tui" }
writ-policy-rego = { path = "crates/writ-policy-rego" }
writ-policy-cedar = { path = "crates/writ-policy-cedar" }
writ-sandbox-docker = { path = "crates/writ-sandbox-docker" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
sha2 = "0.11"
hex = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
# NOTE: default features that pull in windows-sys (color/ansi) are disabled —
# this environment's binutils can't build raw-dylib import libs (ADR-006).
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
