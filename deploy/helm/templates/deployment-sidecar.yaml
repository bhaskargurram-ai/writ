apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-example-agent-with-writ-sidecar"
  labels:
    app.kubernetes.io/name: writ
    app.kubernetes.io/component: sidecar-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: writ
      app.kubernetes.io/component: sidecar-example
  template:
    metadata:
      labels:
        app.kubernetes.io/name: writ
        app.kubernetes.io/component: sidecar-example
      annotations:
        writ.dev/scaffold: "wave-3-example-not-installed-by-default"
    spec:
      serviceAccountName: "{{ .Values.serviceAccount.name }}"
      containers:
        - name: agent
          image: "alpine:3.20"
          command: ["/bin/sh", "-c", "sleep 3600"]
        - name: writ-sidecar
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          args: ["gateway", "--sidecar", "--policy", "/etc/writ/writ.yaml"]
          env:
            - name: WRIT_LEDGER_BACKEND
              value: "{{ .Values.ledger.backend }}"
            - name: WRIT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.ledger.postgres.existingSecret }}"
                  key: "{{ .Values.ledger.postgres.urlKey }}"
          volumeMounts:
            - name: policy
              mountPath: /etc/writ
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: "{{ .Release.Name }}-writ-policy"
