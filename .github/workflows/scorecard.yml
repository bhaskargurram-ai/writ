name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Scorecard status
        run: |
          echo "OpenSSF Scorecard is intentionally not blocking CI yet."
          echo "The upstream scorecard-action image is hosted on gcr.io and can fail before the step starts in this environment."
          echo "Run manually when the registry is reachable: gh workflow run scorecard.yml"