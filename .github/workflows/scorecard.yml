name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'   # weekly

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # Informational for now: the upstream action image is hosted on gcr.io,
      # which can fail for reasons outside this repository (for example GCR
      # billing/availability errors). Do not block development on that.
      - uses: ossf/scorecard-action@v2.4.0
        continue-on-error: true
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: results.sarif
