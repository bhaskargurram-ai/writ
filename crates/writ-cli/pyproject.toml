# PyPI distribution of the `writ` binary (maturin, bin bindings): one wheel
# per platform carrying the compiled executable, so `pip install writ-cli`
# (or `pip install writ-sdk`, which depends on it) needs no Rust toolchain.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "writ-cli"
dynamic = ["version"]
description = "The writ binary: authorization and provenance for AI agents. One policy file, one tamper-evident ledger, any agent."
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [{ name = "Bhaskar Gurram", email = "gurrambhaskar.ai@gmail.com" }]
keywords = ["ai-agents", "authorization", "policy", "audit", "mcp", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://writ-omega.vercel.app"
Source = "https://github.com/writ-agent/writ"
Issues = "https://github.com/writ-agent/writ/issues"

[tool.maturin]
bindings = "bin"
strip = true
