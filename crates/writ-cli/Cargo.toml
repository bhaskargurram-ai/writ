[package]
name = "writ-cli"
description = "The writ binary: run, proxy, log, show, verify, replay, policy test/add, doctor, report."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "writ"
path = "src/main.rs"

[dependencies]
writ-core.workspace = true
writ-policy.workspace = true
writ-ledger.workspace = true
writ-mcp.workspace = true
writ-sandbox.workspace = true
writ-replay.workspace = true
writ-otel.workspace = true
writ-tui.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
regex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Signed receipts, inclusion proofs, Rekor / file anchoring (`writ receipt`).
writ-receipts.workspace = true
# Format-preserving edits of Codex's config.toml (`writ integrate codex`).
toml_edit = "0.25"

[dev-dependencies]
# Mock Rekor log in tests/receipt_anchor.rs (signs SETs and checkpoints).
p256 = { version = "0.14", default-features = false, features = ["std", "ecdsa", "pem"] }
sha2.workspace = true
hex.workspace = true
base64 = "0.23"
# Fake MCP agent client in tests/proxy_http_*.rs.
ureq = { version = "3", default-features = false }

[features]
default = []
# SQLite ledger store (WAL); compiles the bundled SQLite C sources.
sqlite = ["writ-ledger/sqlite"]
postgres = ["writ-ledger/postgres"]
