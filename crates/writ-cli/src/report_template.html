<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>writ run report</title>
<style>
  body {{ font-family: ui-monospace, Consolas, monospace; background: #0d0d0f; color: #e6e6e6; margin: 2rem auto; max-width: 1100px; padding: 0 1rem; }}
  h1 {{ letter-spacing: -0.03em; }} h1 span {{ color: #6366f1; }}
  .cards {{ display: flex; gap: 1rem; margin: 1.5rem 0; flex-wrap: wrap; }}
  .card {{ background: #17171a; border: 1px solid #26262b; border-radius: 8px; padding: 1rem 1.5rem; min-width: 120px; }}
  .card b {{ font-size: 1.8rem; display: block; }}
  table {{ width: 100%; border-collapse: collapse; font-size: 0.9rem; }}
  th, td {{ text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #26262b; }}
  .badge {{ padding: 0.1rem 0.5rem; border-radius: 4px; font-weight: 700; }}
  .badge.allow {{ background: #14532d; color: #bbf7d0; }}
  .badge.deny  {{ background: #7f1d1d; color: #fecaca; }}
  .badge.ask   {{ background: #713f12; color: #fde68a; }}
  .badge.redact {{ background: #164e63; color: #a5f3fc; }}
  footer {{ margin-top: 2rem; color: #71717a; font-size: 0.8rem; }}
</style>
</head>
<body>
<h1>writ<span>.</span> run report</h1>
<p>Every decision below is a hash-chained ledger record. Verify with <code>writ verify</code>.</p>
<div class="cards">
  <div class="card"><b>{}</b>allowed</div>
  <div class="card"><b>{}</b>denied</div>
  <div class="card"><b>{}</b>asked</div>
  <div class="card"><b>{}</b>redacted</div>
</div>
<table>
<thead><tr><th>#</th><th>time (UTC)</th><th>tool</th><th>verdict</th><th>rule</th><th>summary</th></tr></thead>
<tbody>
{}
</tbody>
</table>
<footer>Generated by writ · tamper-evident ledger, locally owned · no content captured by default</footer>
</body>
</html>
