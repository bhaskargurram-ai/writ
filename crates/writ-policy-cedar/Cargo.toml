[package]
name = "writ-policy-cedar"
description = "Cedar policy engine backend for writ: writ.yaml semantics compiled to Cedar policies, producing the shared verdict IR."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
writ-core.workspace = true
writ-policy.workspace = true
# Same crate the native engine compiles `matches` patterns with: regex
# predicates are evaluated host-side (Cedar has no regex) using the very
# `Regex` values writ-policy compiled.
regex.workspace = true
cedar-policy = "4"
