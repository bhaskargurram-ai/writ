[package]
name = "writ-bench"
description = "Criterion benches for writ hot paths: native policy evaluate, ledger append/verify, MCP codec round-trip."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/writ-agent/writ"
publish = false

# Standalone by design: the empty [workspace] table keeps this crate OUT of the
# root cargo workspace, so root Cargo.toml needs no edit and the bench-only
# dependency (criterion) never lands in the workspace dependency graph.
[workspace]

[dependencies]
writ-core = { path = "../writ-core" }
writ-policy = { path = "../writ-policy" }
writ-ledger = { path = "../writ-ledger" }
writ-mcp = { path = "../writ-mcp" }
serde_json = "1"

[dev-dependencies]
# Plotters/html reports disabled: the numbers live in bench stdout, not charts.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "policy"
harness = false

[[bench]]
name = "ledger"
harness = false

[[bench]]
name = "mcp_codec"
harness = false