[package]
name = "writ-bench"
description = "Criterion benches for writ hot paths: native policy evaluate, ledger append/verify, MCP codec round-trip."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/writ-agent/writ"
publish = false

# Standalone by design: the empty [workspace] table keeps this crate OUT of the
# root cargo workspace, so root Cargo.toml needs no edit and the bench-only
# dependency (criterion) never lands in the workspace dependency graph.
[workspace]

[dependencies]
writ-core = { path = "../writ-core" }
writ-policy = { path = "../writ-policy" }
writ-ledger = { path = "../writ-ledger" }
writ-mcp = { path = "../writ-mcp" }
serde_json = "1"

[dev-dependencies]
# Plotters/html reports disabled: the numbers live in bench stdout, not charts.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# ADR-006/ADR-007: this environment's GNU toolchain dlltool cannot build the
# raw-dylib import libs that windows-sys >= 0.52 needs. criterion's two Windows
# transitive deps otherwise resolve to windows-sys 0.61; pin the versions whose
# Windows backends predate raw-dylib (is-terminal <= 0.4.6 uses windows-sys
# 0.48's companion-crate import libs; walkdir 2.3.x + winapi-util 0.1.5 use
# winapi's shipped import libs). Revisit if the toolchain situation changes.
is-terminal = "=0.4.6"
walkdir = "=2.3.3"
winapi-util = "=0.1.5"

[[bench]]
name = "policy"
harness = false

[[bench]]
name = "ledger"
harness = false

[[bench]]
name = "mcp_codec"
harness = false