# Fixtures for packs/gcp-azure-safety, run against the pack wrapped in
# `version: 1` / `default: ask` (unmatched -> rule_id: default). Args are
# shaped like Claude Code's Bash / PowerShell tool input.

# --- deny -----------------------------------------------------------------
- name: gcloud projects delete denied
  ctx: { tool: bash, args: { command: "gcloud projects delete acme-prod --quiet", description: "Remove old project" } }
  expect: { verdict: deny, rule_id: gcp-project-delete-denied }

- name: Windows gcloud.cmd projects delete denied
  ctx: { tool: bash, args: { command: "gcloud.cmd projects delete acme-prod" } }
  expect: { verdict: deny, rule_id: gcp-project-delete-denied }

- name: gcloud logging sinks delete denied
  ctx: { tool: bash, args: { command: "gcloud logging sinks delete org-audit-sink --organization=123" } }
  expect: { verdict: deny, rule_id: gcp-audit-logging-tamper-denied }

- name: az keyvault purge denied
  ctx: { tool: bash, args: { command: "az keyvault purge --name kv-prod" } }
  expect: { verdict: deny, rule_id: az-keyvault-purge-denied }

- name: az keyvault secret purge denied
  ctx: { tool: bash, args: { command: "az keyvault secret purge --vault-name kv-prod --name db-password" } }
  expect: { verdict: deny, rule_id: az-keyvault-purge-denied }

- name: PowerShell Remove-AzKeyVault -InRemovedState denied
  ctx: { tool: bash, args: { command: "Remove-AzKeyVault -VaultName kv-prod -Location eastus -InRemovedState -Force" } }
  expect: { verdict: deny, rule_id: az-keyvault-purge-denied }

- name: az monitor diagnostic-settings delete denied
  ctx: { tool: bash, args: { command: "az monitor diagnostic-settings delete --name audit --resource /subscriptions/x/resourceGroups/rg/providers/Microsoft.KeyVault/vaults/kv" } }
  expect: { verdict: deny, rule_id: az-audit-logging-tamper-denied }

# --- ask ------------------------------------------------------------------
