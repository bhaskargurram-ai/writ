- name: gsutil rb asks
  ctx: { tool: bash, args: { command: "gsutil rb gs://acme-scratch" } }
  expect: { verdict: ask, rule_id: gcp-storage-delete-asks }

- name: gsutil rsync -d (mirror deletes) asks
