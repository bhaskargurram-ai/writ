id: k8s-prod
version: 0.2.0
description: Guardrails for kubectl against production clusters.
# Subcommands are matched anywhere after `kubectl` within one pipeline
# segment, so global flags before them (--context prod, -n ns,
# --kubeconfig=...) do not hide a delete, restart, exec or drain.
rules:
  - id: k8s-delete-ns-denied
    when: tool == "bash" and command matches "(?i)\bkubectl(\.exe)?\s[^;&|]*?\bdelete\s+(ns|namespaces?)\b"
    verdict: deny
    reason: "Deleting a namespace deletes everything in it. Use targeted deletes with a human in the loop."

  - id: k8s-prod-delete-asks
    when: tool == "bash" and command matches "(?i)\bkubectl(\.exe)?\s[^;&|]*?\bdelete\b" and command matches "prod|production"
    verdict: ask
    reason: "Deleting prod workloads. Confirm the resource, the context, and the blast radius."
    irreversible: true
    timeout: 10m

  - id: k8s-prod-rollout-asks
    when: tool == "bash" and command matches "(?i)\bkubectl(\.exe)?\s[^;&|]*?\brollout\s+restart\b" and command matches "prod|production"
    verdict: ask
    reason: "Restarting prod workloads causes a rolling disruption window."

  - id: k8s-exec-prod-asks
    when: tool == "bash" and command matches "(?i)\bkubectl(\.exe)?\s[^;&|]*?\bexec\b" and command matches "prod|production"
    verdict: ask
    reason: "Interactive shell into a prod pod — every keystroke becomes part of the audit record."

  - id: k8s-drain-asks
    when: tool == "bash" and command matches "(?i)\bkubectl(\.exe)?\s[^;&|]*?\bdrain\b"
    verdict: ask
    reason: "Draining a node evicts all pods. Confirm capacity headroom first."
